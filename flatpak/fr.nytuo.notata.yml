app-id: fr.nytuo.notata
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: notata
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
  env:
    CARGO_HOME: /run/build/notata/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: ffmpeg
    config-opts:
      - --enable-static
      - --disable-shared
      - --disable-doc
      - --disable-debug
      - --disable-ffplay
      - --enable-gpl
      - --enable-libmp3lame
      - --enable-libopus
      - --enable-libvorbis
    cleanup:
      - /include
      - /lib
      - /share
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz
        sha256: 089bc60fb59d6aecc5d994ff530fd0dcb3ee39aa55867849a2bbc4e555f9c304
        x-checker-data:
          type: anitya
          project-id: 5405
          url-template: https://ffmpeg.org/releases/ffmpeg-$version.tar.xz

  - name: notata
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/notata/flatpak-node/cache
        npm_config_cache: /run/build/notata/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - npm ci --offline --ignore-scripts
      - npm run build
      - cargo --offline build --release --manifest-path src-tauri/Cargo.toml --no-default-features --features tauri/custom-protocol
      - install -Dm755 src-tauri/target/release/notata ${FLATPAK_DEST}/bin/notata
      - install -Dm644 src-tauri/icons/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .claude
          - node_modules
          - dist
          - demix
          - src-tauri/target
          - flatpak/build-dir
          - flatpak/.flatpak-builder
      - type: file
        path: fr.nytuo.notata.desktop
      - type: file
        path: fr.nytuo.notata.metainfo.xml
      - cargo-sources.json
      - node-sources.json
